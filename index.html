<style>

.choice-list{display:grid;gap:9px}

#playground.active{opacity:1;pointer-events:auto;transform:scale(1)}
.topbar{position:absolute;left:clamp(22px,5vw,70px);right:clamp(22px,5vw,70px);top:clamp(22px,4vh,42px);display:flex;justify-content:space-between;align-items:center}
.back,.sound-toggle{border:0;background:none;color:#303030;padding:10px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.back{display:flex;align-items:center;gap:11px}.back span{font-size:18px;line-height:10px;transition:transform .2s}.back:hover span{transform:translateX(-4px)}
.sound-toggle{display:flex;align-items:center;gap:9px;color:#666}.sound-dot{width:7px;height:7px;border:1px solid #777;border-radius:50%;display:inline-block}.sound-toggle[aria-pressed="true"] .sound-dot{background:#111;border-color:#111}
.play-title{position:absolute;top:14%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.play-title .eyebrow{color:#888;margin-bottom:11px;font-size:9px}.play-title h2{font-size:clamp(27px,3.4vw,43px);font-weight:400;letter-spacing:-.055em;margin:0}
.object-stage{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(70vw,500px);height:min(70vw,500px);display:grid;place-items:center;touch-action:none}
.spinner-wrap{width:min(72vw,420px);aspect-ratio:1;position:relative;display:grid;place-items:center;touch-action:none;user-select:none}
.spinner-wrap:before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#fff 28%,rgba(255,255,255,.7) 50%,transparent 72%);filter:blur(13px);opacity:.75}
.spinner-svg{width:100%;height:100%;overflow:visible;position:relative;filter:drop-shadow(0 16px 22px rgba(0,0,0,.12));will-change:transform}
.spinner-arm{fill:url(#spinFill);stroke:#1b1b1b;stroke-width:2.3}
.spinner-orbit{fill:none;stroke:#fff;stroke-width:2.5;opacity:.65}
.spinner-bearing{fill:#f7f7f7;stroke:#151515;stroke-width:2.5}
.spinner-center{fill:#d4d4d4;stroke:#222;stroke-width:1.8}
.stage-instruction{position:absolute;bottom:clamp(33px,8vh,78px);left:50%;transform:translateX(-50%);color:#888;font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.cube-stage{perspective:1000px;width:240px;height:240px;display:none;place-items:center;transform:translateY(-8px)}
.cube{position:relative;width:180px;height:180px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-37deg);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
.face{position:absolute;width:180px;height:180px;border:1px solid #343434;background:linear-gradient(145deg,#292929,#101010 70%);border-radius:19px;display:grid;place-items:center;box-shadow:inset 2px 2px 8px rgba(255,255,255,.1),inset -4px -5px 10px rgba(0,0,0,.8),0 8px 14px rgba(0,0,0,.14);backface-visibility:hidden}
.face.front{transform:translateZ(90px)}.face.right{transform:rotateY(90deg) translateZ(90px)}.face.top{transform:rotateX(90deg) translateZ(90px)}
.face.top{background:linear-gradient(145deg,#414141,#171717)}.face.right{background:linear-gradient(120deg,#202020,#070707)}
.pads{width:100%;height:100%;padding:23px;display:grid;gap:14px;align-content:center;justify-content:center}
.pads.row3{grid-template-columns:repeat(3,38px)}.pads.row2{grid-template-columns:repeat(2,40px)}
.pad{width:38px;height:38px;border-radius:11px;border:1px solid #585858;background:linear-gradient(145deg,#4a4a4a,#242424);box-shadow:2px 3px 5px rgba(0,0,0,.55),inset 1px 1px 2px rgba(255,255,255,.22);transition:transform .08s ease,background .1s ease,box-shadow .1s ease;cursor:inherit;display:grid;place-items:center;color:#d8d8d8;padding:0}
.pads.row2 .pad{width:40px;height:54px}
.pad:before{content:"";width:9px;height:9px;border-radius:50%;border:1px solid #aaa;opacity:.75}
.pad:hover{background:linear-gradient(145deg,#666,#303030)}.pad:active,.pad.pressed{transform:translate(2px,3px);box-shadow:inset 2px 3px 5px rgba(0,0,0,.7);background:#222}
.cube-hint{display:none}
#playground.mode-cube .spinner-wrap{display:none}#playground.mode-cube .cube-stage{display:grid}#playground.mode-cube .spinner-hint{display:none}#playground.mode-cube .cube-hint{display:block}
#playground.mode-cube{color:#f5f5f3;background:radial-gradient(ellipse at 50% 45%,#202020 0,#111 43%,#080808 100%)}
#playground.mode-cube .topbar .back,#playground.mode-cube .sound-toggle{color:#ddd}
#playground.mode-cube .topbar .sound-toggle{color:#aaa}
#playground.mode-cube .play-title .eyebrow{color:#aaa}
#playground.mode-cube .stage-instruction{color:#999}
#playground.mode-cube .sound-dot{border-color:#aaa}#playground.mode-cube .sound-toggle[aria-pressed="true"] .sound-dot{background:#fff;border-color:#fff}
.footer-note{position:absolute;left:50%;bottom:clamp(22px,4vh,40px);transform:translateX(-50%);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#aaa;white-space:nowrap}
#playground:not(.mode-cube) .footer-note{color:#aaa}
@media(max-width:700px){.hero-copy{top:17%;}.hero-copy h1{font-size:48px}.choice{left:50%;right:auto;top:auto;bottom:8%;transform:translate(-50%,20px);width:min(390px,calc(100vw - 40px))}#intro.powered .choice{transform:translate(-50%,0)}.choice h2{margin-bottom:14px;font-size:27px}.choice-card{padding:13px 15px}.scene{opacity:.8}.hint{right:24px;bottom:4%}.object-stage{top:51%;width:min(86vw,440px);height:min(86vw,440px)}.spinner-wrap{width:min(84vw,390px)}.play-title{top:17%}.cube-stage{transform:translateY(-4px) scale(.84)}.stage-instruction{bottom:9%}.footer-note{bottom:3%}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
/* The entrance is intentionally wordless; only the two oversized choices appear once lit. */
.brand,.hero-copy,.hint,.choice .eyebrow,.choice h2,.choice-sub,.arrow{display:none!important}
.choice{right:clamp(24px,6vw,90px);top:52%;width:min(720px,60vw);transform:translateY(-42%) translateY(15px);visibility:hidden;transition:opacity .75s ease,transform .75s var(--ease),visibility 0s linear .75s}
#intro.powered .choice{opacity:1;pointer-events:auto;transform:translateY(-50%);visibility:visible;transition-delay:0s}
.choice-list{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.choice-card{width:auto;display:block;padding:0;border:0;background:none;text-align:left;line-height:.94;transform:translateX(0);transition:color .25s ease,transform .3s var(--ease)}
.choice-card:hover{background:none;border:0;transform:translateX(12px);color:#cfcfcf}
.choice-name{display:block;font-size:clamp(44px,6.9vw,100px);font-weight:700;letter-spacing:-.075em;line-height:.94;white-space:nowrap}
.bulb-glow{filter:blur(22px)}
.bulb-glass{fill:url(#glass);stroke:url(#glassEdge);stroke-width:1.5}
#intro.powered .bulb-glass{fill:url(#litGlass);stroke:#f5f5f5;filter:url(#glow)}
.spinner-svg{filter:drop-shadow(0 18px 20px rgba(0,0,0,.2));transform-origin:50% 50%}
.spinner-arm path{fill:url(#spinFace);stroke:#222;stroke-width:2.5;stroke-linejoin:round}
.spinner-arm .arm-highlight{fill:none;stroke:#fff;stroke-opacity:.52;stroke-width:2;stroke-linecap:round}
.spinner-ring{fill:url(#spinRim);stroke:#171717;stroke-width:3}
.spinner-race{fill:#202020;stroke:#777;stroke-width:1.6}
.spinner-inner{fill:url(#spinFace);stroke:#555;stroke-width:1.5}
.spinner-center{fill:url(#spinRim);stroke:#222;stroke-width:2.5}
.spinner-screw{fill:#151515;stroke:#aaa;stroke-width:1.4}
.spinner-wrap.spinning:after{content:"";position:absolute;inset:10%;border:1px solid rgba(0,0,0,.08);border-radius:50%;animation:spinHalo .9s ease-out infinite}
@keyframes spinHalo{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1.12);opacity:0}}
.cube-stage{perspective:1150px;width:300px;height:300px;touch-action:none;cursor:grab;user-select:none}
.cube-stage:active{cursor:grabbing}
.cube{width:220px;height:220px;cursor:grab}
.face{width:220px;height:220px;border-radius:22px}

.face.back{transform:rotateY(180deg) translateZ(110px)}.face.left{transform:rotateY(-90deg) translateZ(110px)}.face.bottom{transform:rotateX(-90deg) translateZ(110px)}

/* New art direction: thermal visit palettes, editorial display type, glass, water. */
:root{--visit-color:#ff7048;--visit-glow:rgba(255,112,72,.18);--spinner-color:#d78368;--ease:cubic-bezier(.2,.8,.2,1)}
#intro{background:radial-gradient(ellipse at 35% 43%,color-mix(in srgb,var(--visit-color) 22%,#151515) 0,color-mix(in srgb,var(--visit-color) 10%,#090909) 38%,#030303 74%)}
#playground:not(.mode-cube){background:radial-gradient(ellipse at 50% 46%,color-mix(in srgb,#fff 82%,var(--visit-color)) 0,#fafaf9 48%,color-mix(in srgb,#f0f0ee 84%,var(--visit-color)) 100%)}
#playground.mode-cube{background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--visit-color) 34%,#202020) 0,#111 49%,#080808 100%)}
.choice-name,.play-title h2{font-family:Didot,"Bodoni MT","Bodoni 72",Baskerville,"Times New Roman",serif;font-weight:700;letter-spacing:-.045em}
.back,.sound-toggle,.power-toggle,.stage-instruction,.footer-note,.eyebrow{font-family:Arial,Helvetica,sans-serif}
.power-toggle{border:0;background:none;color:#777;padding:10px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;transition:color .25s ease,transform .25s var(--ease);}
.power-toggle:hover{color:var(--visit-color);transform:translateY(-2px)}
#intro.leaving{opacity:1;transform:none;pointer-events:none;background:transparent;z-index:4}
#intro.leaving .choice{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#intro.leaving .bulb,#intro.leaving .socket{opacity:.10;transition:opacity .4s ease}
#intro.leaving .bulb-glow,#intro.leaving .socket-glow{opacity:0!important}
#intro.leaving #wire-shadow{opacity:0}#intro.leaving #wire{opacity:.20}#intro.leaving #wire-braid{opacity:.23}#intro.leaving #wire-light{opacity:.32}
#intro.leaving #plug{opacity:1;pointer-events:all;cursor:grab;filter:drop-shadow(0 7px 12px rgba(0,0,0,.25))}
#intro.leaving #plug:active{cursor:grabbing}
.spinner-svg{--spinner-color:#d78368}
.spinner-arm path:not(.arm-highlight){fill:url(#spinFace);transition:fill .5s ease}
.spinner-colors{position:fixed;z-index:5;left:50%;bottom:clamp(76px,10vh,98px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(20,16px);gap:5px;padding:6px 10px;border-radius:24px;background:rgba(255,255,255,.38);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 32px rgba(25,25,25,.06);}
.color-swatch{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);padding:0;background:var(--swatch);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s ease;}
.color-swatch:hover{transform:scale(1.28);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.color-swatch.is-selected{outline:1.5px solid #181818;outline-offset:2px;transform:scale(1.12)}
#playground.mode-cube .spinner-colors{display:none}
.face{background:linear-gradient(145deg,color-mix(in srgb,var(--visit-color) 38%,#444),color-mix(in srgb,var(--visit-color) 22%,#151515) 60%,#0b0b0b);border-color:color-mix(in srgb,var(--visit-color) 35%,#454545);backdrop-filter:blur(7px);}
.face::before{content:"";position:absolute;inset:2px;border-radius:inherit;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.20),transparent 26%,transparent 65%,rgba(255,255,255,.045));box-shadow:inset 0 1px 0 rgba(255,255,255,.18);opacity:.8}
.face .pads,.face .cube-wheel{position:relative;z-index:1}
.face.front .pads{height:calc(100% - 33px);padding:18px 28px 0;gap:8px}
.face.front .pads.row3{grid-template-columns:repeat(3,38px)}
.face.front .pad{width:38px;height:38px;border-radius:12px}
.cube-wheel{width:82px;height:24px;border-radius:18px;border:1px solid #666;background:linear-gradient(180deg,#999 0,#3c3c3c 27%,#191919 56%,#696969 85%,#222);box-shadow:inset 0 2px 4px rgba(255,255,255,.35),0 3px 5px rgba(0,0,0,.58);display:grid;place-items:center;padding:0;cursor:ns-resize;touch-action:none;overflow:hidden;}
.wheel-roller{width:67px;height:13px;border-radius:10px;background:repeating-linear-gradient(90deg,#161616 0 2px,#8d8d8d 2px 3px,#303030 3px 5px);box-shadow:inset 0 1px 2px rgba(255,255,255,.32);transform:rotate(var(--roll,0deg));transition:filter .15s ease;}
.cube-wheel:hover .wheel-roller{filter:brightness(1.35)}.cube-wheel:active{transform:translateY(1px);box-shadow:inset 0 3px 5px rgba(0,0,0,.65)}
.pad{background:linear-gradient(145deg,color-mix(in srgb,var(--visit-color) 28%,#777),color-mix(in srgb,var(--visit-color) 18%,#292929));box-shadow:2px 3px 5px rgba(0,0,0,.55),inset 1px 1px 3px rgba(255,255,255,.36);}
.pad:hover{background:linear-gradient(145deg,color-mix(in srgb,var(--visit-color) 48%,#999),color-mix(in srgb,var(--visit-color) 27%,#303030))}
.pad:active,.pad.pressed{background:linear-gradient(145deg,color-mix(in srgb,var(--visit-color) 45%,#333),#171717);}
.water-ripple{position:absolute;left:var(--ripple-x);top:var(--ripple-y);width:90px;height:90px;border:1px solid color-mix(in srgb,var(--visit-color) 62%,rgba(255,255,255,.75));border-radius:50%;pointer-events:none;z-index:8;transform:translate(-50%,-50%) scale(.08);opacity:.7;backdrop-filter:blur(5px);box-shadow:0 0 0 7px color-mix(in srgb,var(--visit-color) 12%,transparent),inset 0 0 22px rgba(255,255,255,.4);animation:water-ripple 1.15s var(--ease) forwards}
.water-ripple::after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.65);border-radius:50%;}
@keyframes water-ripple{0%{transform:translate(-50%,-50%) scale(.08);opacity:.66}45%{opacity:.34}100%{transform:translate(-50%,-50%) scale(4.3);opacity:0}}
.ditherable{position:relative;isolation:isolate;transition:color .2s ease,text-shadow .2s ease}
.ditherable::after{content:attr(data-dither);position:absolute;inset:0;display:block;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;background-image:radial-gradient(var(--dither-ink,#111) .7px,transparent .95px);background-size:3px 3px;background-position:center;-webkit-background-clip:text;background-clip:text;clip-path:circle(0 at var(--mx,50%) var(--my,50%));opacity:0;transition:clip-path .22s var(--ease),opacity .2s ease;white-space:inherit}

.dither-label{--dither-ink:currentColor;position:relative;display:inline-block;line-height:inherit;white-space:nowrap;}
.dither-label::after{content:attr(data-dither);position:absolute;inset:0;display:block;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;background-image:radial-gradient(var(--dither-ink,#111) .7px,transparent .95px);background-size:3px 3px;background-position:center;-webkit-background-clip:text;background-clip:text;clip-path:circle(0 at var(--mx,50%) var(--my,50%));opacity:0;transition:clip-path .22s var(--ease),opacity .2s ease;white-space:inherit;line-height:inherit;}

.choice-name.dither-label{display:block}
@media(max-width:700px){.spinner-colors{grid-template-columns:repeat(20,12px);gap:3px;padding:5px 6px;bottom:clamp(72px,13vh,105px)}.color-swatch{width:12px;height:12px}.cube-wheel{width:75px}.face.front .pads{padding-top:15px;gap:7px}}

/* Entrance color wash and focus the cord only on the entry/choice page. */
#entryLightwash{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 36% 43%,color-mix(in srgb,#fff 63%,var(--visit-color)) 0,color-mix(in srgb,#fff 82%,var(--visit-color)) 48%,#f6f6f3 100%);transition:opacity 1.65s cubic-bezier(.2,.8,.2,1)}
#intro.powered #entryLightwash{opacity:1}
#intro .scene{z-index:1}
#intro.powered .choice-name{color:#111}
#intro.leaving{opacity:0;transform:scale(1.012);pointer-events:none;background:transparent;z-index:2}
#intro.leaving .scene{visibility:hidden!important}
#intro.leaving .choice{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.choice-name{font-family:Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.075em}
.spinner-colors{position:fixed;left:50%;bottom:clamp(78px,11vh,108px);width:min(760px,calc(100vw - 32px));display:flex;align-items:center;justify-content:center;gap:8px;padding:25px 20px 15px;border:1px solid rgba(255,255,255,.68);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.73),rgba(255,255,255,.34) 52%,rgba(255,255,255,.19));box-shadow:0 24px 90px rgba(20,20,20,.12),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(28px) saturate(1.75);-webkit-backdrop-filter:blur(28px) saturate(1.75);opacity:0;transform:translateX(-50%) translateY(26px) scale(.94);pointer-events:none;}
.spinner-colors::before{content:"SPINNER / FINISH";position:absolute;left:24px;top:8px;font:9px/1 Arial,Helvetica,sans-serif;letter-spacing:.18em;color:rgba(25,25,25,.52)}
.spinner-colors::after{content:"";position:absolute;left:9%;right:9%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)}
.color-swatch{width:16px;height:16px;flex:0 0 auto}
#playground.active:not(.mode-cube) .spinner-colors{animation:glass-picker-reveal 2.15s cubic-bezier(.18,.72,.2,1) .36s both;pointer-events:auto}
@keyframes glass-picker-reveal{0%{opacity:0;transform:translateX(-50%) translateY(28px) scale(.92);filter:blur(10px)}48%{opacity:.62}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);filter:blur(0)}}
#playground.mode-cube .spinner-colors{display:none}
#pixelTrail{position:fixed;inset:0;z-index:99;overflow:hidden;pointer-events:none}
.pixel-speck{position:absolute;left:var(--px);top:var(--py);width:var(--ps);height:var(--ps);background:var(--pc);opacity:0;image-rendering:pixelated;box-shadow:0 0 0 1px rgba(255,255,255,.24),0 0 9px var(--visit-glow);animation:pixel-drift .64s steps(7,end) forwards;will-change:transform,opacity}
@keyframes pixel-drift{0%{opacity:0;transform:translate3d(0,0,0) scale(.4)}18%{opacity:.94;transform:translate3d(0,0,0) scale(1)}100%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) scale(.12)}}
.choice-name.dither-label:hover{ text-shadow:0 0 14px var(--visit-glow)}
@media(max-width:700px){.spinner-colors{width:calc(100vw - 24px);gap:4px;padding:23px 8px 13px;bottom:clamp(78px,14vh,112px)}.color-swatch{width:12px;height:12px}.spinner-colors::before{left:18px;top:7px;font-size:8px}}

/* Center the spinner on the viewport, independent of the palette rail. */
#playground:not(.mode-cube) .object-stage{position:fixed!important;left:50vw!important;top:50vh!important;transform:translate(-50%,-50%)!important;width:min(70vw,500px);height:min(70vw,500px)}

.spinner-colors{position:fixed;left:clamp(12px,2.2vw,30px);right:auto;top:50%;bottom:auto;width:76px;height:min(74vh,520px);max-height:calc(100vh - 90px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:28px 10px 16px;transform:translateY(-50%) translateX(-24px) scale(.94);scrollbar-width:none;}

.spinner-colors::after{left:14%;right:14%}
.color-swatch{width:16px;height:16px}

<script>
(()=>{
 const visitPalette=['#4831a8','#4e38c4','#3d4fc2','#2d61c7','#2879d2','#2285ce','#159ab8','#14a6a4','#0d9a84','#258f69','#3f9a52','#64a43c','#7aae35','#9caf34','#bcb83a','#d2be36','#e0b632','#e59d27','#e98623','#f07127','#f16028','#e94b34','#db3d4c','#cf3561','#c5367b','#b43b96','#9b3fae','#8041b7','#6f44b9','#5b4cb3','#3c45a2','#3b5f9b','#367c98','#278a91','#2c8d78','#418b60','#5a913e','#7d983a','#9e9d36','#b7a338','#d39e2d','#dc832a','#df6331','#cc4f42','#ba4255','#a23f72','#8c418a','#70438f','#59508f','#52557d'];
 let previous=-1;try{const stored=localStorage.getItem('little-things-last-palette');previous=stored===null?-1:Number(stored)}catch{}
 let chosen=Math.floor(Math.random()*(visitPalette.length-1));if(chosen>=previous)chosen++;if(previous<0||previous>=visitPalette.length)chosen=Math.floor(Math.random()*visitPalette.length);

 prepareDither();new MutationObserver(prepareDither).observe(document.body,{subtree:true,childList:true,characterData:true});
 const playground=document.getElementById('playground');playground.addEventListener('pointerdown',e=>{if(!playground.classList.contains('active'))return;const r=playground.getBoundingClientRect(),drop=document.createElement('i');drop.className='water-ripple';drop.style.setProperty('--ripple-x',`${e.clientX-r.left}px`);drop.style.setProperty('--ripple-y',`${e.clientY-r.top}px`);playground.appendChild(drop);setTimeout(()=>drop.remove(),1250)});
 const pixelLayer=document.createElement('div');pixelLayer.id='pixelTrail';document.body.appendChild(pixelLayer);let lastPixel=0,pixelCount=0;const lowMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches||window.matchMedia('(pointer: coarse)').matches;
 if(!lowMotion)document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const now=performance.now();if(now-lastPixel<28)return;lastPixel=now;const particle=document.createElement('i');particle.className='pixel-speck';particle.style.setProperty('--ps',`${2+Math.round(Math.random()*3)}px`);particle.style.setProperty('--px',`${e.clientX+(Math.random()-.5)*10}px`);particle.style.setProperty('--py',`${e.clientY+(Math.random()-.5)*10}px`);particle.style.setProperty('--dx',`${(Math.random()-.5)*28}px`);particle.style.setProperty('--dy',`${(Math.random()-.5)*28+8}px`);particle.style.setProperty('--pc',pixelCount++%2?'var(--visit-color)':'rgba(245,245,245,.92)');pixelLayer.appendChild(particle);if(pixelLayer.childElementCount>36)pixelLayer.firstElementChild.remove();setTimeout(()=>particle.remove(),680)},{passive:true});
})();
